<svg xmlns="http://www.w3.org/2000/svg" class="drawing" viewBox="0 0 660 350" role="img" aria-label="Concept of a wall-mounted screw-lid enclosure, with USB power and heater cable exiting below, and a separate small vented sensor housing alongside it.">
<style>
#nibe-case-concept{color:#202934}
.drawing{display:block;width:100%;height:auto}
.shell{fill:#e0e4e8;stroke:#929ba5;stroke-width:2}
.face{fill:#f7f8fa;stroke:#929ba5;stroke-width:2}
.board{fill:#e0eee6;stroke:#3e775b;stroke-width:1.5}
.metal{fill:#c6cdd4;stroke:#596570;stroke-width:1.5}
.dark{fill:#596570}
.sensor{fill:#dceafa;stroke:#35689e;stroke-width:1.5}
.trace{fill:none;stroke:#596570;stroke-width:2}
.power{fill:none;stroke:#c36328;stroke-width:3}
.signal{fill:none;stroke:#476fc0;stroke-width:3}
.contact{fill:none;stroke:#8752a3;stroke-width:3}
.lead{fill:none;stroke:#929ba5;stroke-width:1.5}
svg text{fill:#202934;font:inherit}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:12px 0 24px}
.parts div{display:flex;gap:8px;align-items:baseline}
.num{font-weight:500;color:#596570}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0}
.swatch{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px}
details{margin-top:16px}
summary{padding:12px 0}
@media(max-width:480px){.parts{grid-template-columns:1fr}.svg-note{display:none}}

svg text{fill:#202934;font:14px sans-serif} .svg-note{display:initial}</style><title>Outside enclosure concept</title>
