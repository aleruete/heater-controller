# Board: Raspberry Pi Pico 2W
# Relay controller; credentials are supplied by private secrets.yaml.

esphome:
  name: nibe-controller
  friendly_name: Nibe Controller

rp2:
  board: rpipico2w

logger:

api:
  encryption:
    key: !secret nibe_controller__encryption_key
  reboot_timeout: 0s
  actions:
    - action: set_schedule_reduction
      variables:
        requested: bool
      then:
        - lambda: |-
            id(schedule_request) = requested;
            id(last_ha_command_ms) = millis();
            id(ha_command_valid) = true;

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: nibe-controller Fallback Hotspot
    password: !secret nibe_controller__ap_password
  reboot_timeout: 0s
  
captive_portal:

# Both Picos must be on a network that permits local UDP broadcasts.
udp:

packet_transport:
  platform: udp
  providers:
    - name: nibe-sensor
      encryption: !secret nibe_sensor_transport_key

sensor:
  - platform: packet_transport
    provider: nibe-sensor
    remote_id: room_temperature
    id: room_temperature
    internal: true
    unit_of_measurement: "°C"
    on_value:
      then:
        - lambda: |-
            id(temperature_valid) = std::isfinite(x);
            if (id(temperature_valid)) {
              id(last_temperature_ms) = millis();
            }

switch:
  - platform: gpio
    id: heating_reduction
    internal: true
    pin:
      number: GPIO14
      inverted: false
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    name: "Reduction Temperature Threshold"
    id: reduction_temperature_threshold
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 30
    step: 0.5
    initial_value: 21
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    name: "Temperature Release Margin"
    id: temperature_release_margin
    unit_of_measurement: "°C"
    min_value: 0.5
    max_value: 3
    step: 0.5
    initial_value: 1
    optimistic: true
    restore_value: true
    mode: box

globals:
  - id: temperature_valid
    type: bool
    initial_value: 'false'

  - id: last_temperature_ms
    type: uint32_t
    initial_value: '0'

  - id: temperature_request
    type: bool
    initial_value: 'false'

  - id: schedule_request
    type: bool
    initial_value: 'false'

  - id: ha_command_valid
    type: bool
    initial_value: 'false'

  - id: last_ha_command_ms
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();

          // Expire Home Assistant's schedule override.
          if (id(ha_command_valid) &&
              uint32_t(now - id(last_ha_command_ms)) >= 60000UL) {
            id(ha_command_valid) = false;
            id(schedule_request) = false;
          }

          const float temperature = id(room_temperature).state;
          const float threshold = id(reduction_temperature_threshold).state;
          const float margin = id(temperature_release_margin).state;

          // Require a valid reading received within 180 seconds.
          const bool sensor_ok =
              id(temperature_valid) &&
              uint32_t(now - id(last_temperature_ms)) < 180000UL &&
              std::isfinite(temperature) &&
              std::isfinite(threshold) &&
              std::isfinite(margin) &&
              margin > 0.0f;

          if (!sensor_ok) {
            id(temperature_request) = false;
            // Clear the thermostat display too, rather than showing stale data.
            if (std::isfinite(temperature)) {
              id(room_temperature).publish_state(NAN);
            }
          } else if (temperature > threshold) {
            id(temperature_request) = true;
          } else if (temperature <= threshold - margin) {
            id(temperature_request) = false;
          }

          const bool reduce =
              id(temperature_request) ||
              (id(ha_command_valid) && id(schedule_request));

          if (reduce != id(heating_reduction).state) {
            if (reduce) {
              id(heating_reduction).turn_on();
            } else {
              id(heating_reduction).turn_off();
            }
          }
      - climate.template.publish:
          id: nibe_thermostat
          mode: AUTO
          target_temperature: !lambda |-
            return id(reduction_temperature_threshold).state;

binary_sensor:
  - platform: template
    name: "Remote Temperature Fresh"
    entity_category: diagnostic
    lambda: |-
      return id(temperature_valid) &&
             uint32_t(millis() - id(last_temperature_ms)) < 180000UL &&
             std::isfinite(id(room_temperature).state);

  - platform: template
    name: "Heating Reduction Active"
    lambda: |-
      return id(heating_reduction).state;

  - platform: template
    name: "Home Assistant Schedule Control Active"
    lambda: |-
      return id(ha_command_valid);
      
climate:
  - platform: template
    name: "NIBE Temperature Control"
    id: nibe_thermostat
    sensor: room_temperature
    optimistic: false
    restore_mode: NO_RESTORE
    supported_modes:
      - AUTO
    initial_state:
      mode: AUTO
      target_temperature: 21
    visual:
      min_temperature: 10
      max_temperature: 30
      temperature_step: 0.5
    set_target_temperature_action:
      - number.set:
          id: reduction_temperature_threshold
          value: !lambda 'return x;'
