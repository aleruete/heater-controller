# Copy into your PRIVATE ESPHome secrets.yaml and replace EVERY placeholder.
# API keys: base64-encoded 32-byte keys from each ESPHome device wizard.
# Hotspot passwords: at least eight characters each.
# Transport secret: a separate random string used by BOTH devices.
# These placeholders are deliberately not usable credentials.
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
nibe_controller__encryption_key: "CONTROLLER_WIZARD_GENERATED_BASE64_KEY"
nibe_controller__ap_password: "YOUR_CONTROLLER_HOTSPOT_PASSWORD"
nibe_sensor__encryption_key: "SENSOR_WIZARD_GENERATED_BASE64_KEY"
nibe_sensor__ap_password: "YOUR_SENSOR_HOTSPOT_PASSWORD"
nibe_sensor_transport_key: "YOUR_RANDOM_SHARED_TRANSPORT_SECRET"
