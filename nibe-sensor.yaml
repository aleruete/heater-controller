# Assumes Pico 2 W and the existing DHT11 on GP15.
# Change board to rpipicow for an original Pico W before installing.
esphome:
  name: nibe-sensor
  friendly_name: NIBE Sensor

rp2:
  board: rpipico2w

logger:

api:
  encryption:
    key: !secret nibe_sensor__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: NIBE Sensor Fallback
    password: !secret nibe_sensor__ap_password
  reboot_timeout: 0s

captive_portal:

# Send readings directly to the controller as well as through the HA API.
udp:

packet_transport:
  platform: udp
  update_interval: 60s
  encryption: !secret nibe_sensor_transport_key
  rolling_code_enable: true
  sensors:
    - room_temperature

sensor:
  - platform: dht
    pin: GPIO15
    model: DHT11
    temperature:
      name: "Room Temperature"
      id: room_temperature
      force_update: true
      filters:
        # Existing thermometer's correction; recheck after moving it.
        - offset: -3.0
        # Do not keep rebroadcasting a last good reading after DHT failure.
        - timeout: 130s
    humidity:
      name: "Room Humidity"
      force_update: true
      filters:
        - timeout: 130s
    update_interval: 60s
